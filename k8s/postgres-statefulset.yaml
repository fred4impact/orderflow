apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: order
spec:
  serviceName: postgres  # Service name for StatefulSet
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_DB
          value: orders
        - name: POSTGRES_USER
          value: orderuser
        - name: POSTGRES_PASSWORD
          value: orderpass
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi

---
# Service for StatefulSet (separate from existing postgres service)
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: order
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  # Regular ClusterIP service - backend can connect to postgres-statefulset:5432
  # If you want pod-specific DNS, change to: clusterIP: None (Headless Service)
