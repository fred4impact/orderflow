# traefik-values.yaml

service:
  type: NodePort

ports:
  web:
    port: 80
    nodePort: 30080
    expose:
      default: true
      exposedPort: 80
  websecure:
    port: 443
    nodePort: 30443
    expose:
      default: true
      exposedPort: 443

providers:
  kubernetesIngress:
    publishedService:
      enabled: true

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.minikube.local`)
    entryPoints:
      - web
